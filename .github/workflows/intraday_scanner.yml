name: Intraday Speed Scanner

on:
  schedule:
    # Runs every 10 minutes from 9:20 AM to 3:20 PM IST (Mon-Fri)
    - cron: '20,30,40,50 3 * * 1-5'   # 9:20, 9:30... IST
    - cron: '0,10,20,30,40,50 4 * * 1-5'  # 10:00 to 10:50
    - cron: '0,10,20,30,40,50 5 * * 1-5'  # 11:00 to 11:50
    - cron: '0,10,20,30,40,50 6 * * 1-5'  # 12:00 to 12:50
    - cron: '0,10,20,30,40,50 7 * * 1-5'  # 13:00 to 13:50
    - cron: '0,10,20 8 * * 1-5'          # 14:00 to 14:20
    - cron: '30 9 * * 1-5'               # 3:00 PM last run

  workflow_dispatch:   # Allows manual run

jobs:
  run-intraday-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intraday Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: python intraday_scanner.py