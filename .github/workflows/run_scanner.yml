name: Run Screener Automated Sync

on:
  schedule:
    - cron: '30 12 * * 1-5'  # Runs Monday to Friday at 6:00 PM IST (12:30 PM UTC)
  workflow_dispatch:        # Allows manual run execution from the Actions panel

jobs:
  build_and_run:
    runs-on: ubuntu-latest

    # Explicitly grant repository write permissions to update the history file
    permissions:
      contents: write

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set Up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Runtime Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Screener Scanner Core
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        SCREENER_USERNAME: ${{ secrets.SCREENER_USERNAME }}
        SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
      run: |
        python scanner.py

    - name: Save Updated History File Back to Repository
      run: |
        git config --global user.name 'GitHub Automation Bot'
        git config --global user.email 'actions@github.com'
        
        # Ensure the file exists before tracking it
        touch holdings_history.json
        git add holdings_history.json
        
        # Only commit and push if the file contents actually changed to avoid execution loops
        git diff --quiet && git diff --staged --quiet || (git commit -m "Sync updated holding pattern tracking cache [skip ci]" && git push)
